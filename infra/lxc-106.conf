# Proxmox LXC definition for CT106 "openjarvis" — the AI inference node.
# Location on the host: /etc/pve/lxc/106.conf
# Sanitized for publication (private LAN / Tailscale addresses only).

arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: openjarvis
memory: 4096
net0: name=eth0,bridge=vmbr0,ip=dhcp,type=veth   # → 192.168.1.113/24 via DHCP
ostype: debian
rootfs: local-lvm:vm-106-disk-0,size=32G
swap: 1024
unprivileged: 1
